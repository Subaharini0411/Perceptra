<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISRO Scientific Payload Proposal - PERCEPTA Testbed</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .form-container {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 32px;
      max-width: 680px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--accent-cyan);
    }
    select.form-control {
      cursor: pointer;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }
    .checkbox-group input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent-cyan);
    }
    .alert-box {
      display: none;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo-section">
      <div class="logo-badge">ISRO</div>
      <div class="logo-title">INDIAN SPACE RESEARCH ORGANISATION</div>
    </div>
    <nav class="nav-links">
      <a href="./index.html" class="nav-item" id="nav-missions">Missions</a>
      <a href="./search.html" class="nav-item" id="nav-search">Search Portal</a>
      <a href="./forms.html" class="nav-item active" id="nav-forms">Payload Proposal</a>
      <a href="./news.html" class="nav-item" id="nav-news">News & Launches</a>
    </nav>
  </header>

  <div class="container">
    <div class="form-container">
      <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 8px;">Scientific Payload & Research Proposal</h2>
      <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 24px;">
        Submit proposal documentation to IN-SPACe / ISRO mission management board.
      </p>

      <div id="submission-alert" class="alert-box alert-success">
        ✓ Proposal submitted successfully. Verification ID: #ISRO-2026-PLD-882
      </div>

      <form id="payload-form" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="investigator-name">Principal Investigator Full Name *</label>
          <input 
            type="text" 
            id="investigator-name" 
            name="name" 
            class="form-control" 
            placeholder="Dr. Vikram Sarabhai" 
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="investigator-email">Official Institutional Email *</label>
          <input 
            type="email" 
            id="investigator-email" 
            name="email" 
            class="form-control" 
            placeholder="scientist@isro.gov.in" 
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="country-select">Country of Origin / Affiliation *</label>
          <select id="country-select" name="country" class="form-control" required>
            <option value="">-- Select Country --</option>
            <option value="India">India</option>
            <option value="Japan">Japan (JAXA)</option>
            <option value="France">France (CNES)</option>
            <option value="Germany">Germany (DLR)</option>
            <option value="USA">United States (NASA)</option>
            <option value="Other">Other International Member</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="mission-type">Target Mission Opportunity *</label>
          <select id="mission-type" name="mission" class="form-control" required>
            <option value="Lunar">Chandrayaan-4 Sample Return Mission</option>
            <option value="Venus">Shukrayaan Venus Orbiter</option>
            <option value="Mars">Mars Lander Mission (MOM-2)</option>
            <option value="SpaceStation">Bharatiya Antariksh Station (BAS)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="proposal-desc">Payload Objective & Scientific Rationale</label>
          <textarea 
            id="proposal-desc" 
            name="description" 
            class="form-control" 
            rows="3" 
            placeholder="Provide brief specifications, mass budget (kg), and power constraints (W)..."
          ></textarea>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="nda-agreement" required />
          <label for="nda-agreement" style="font-size: 13px; color: #94a3b8; cursor: pointer;">
            I confirm compliance with Department of Space safety protocols & data regulations.
          </label>
        </div>

        <div style="margin-top: 24px; display: flex; gap: 12px;">
          <button type="submit" id="btn-submit-proposal" class="search-btn" style="flex: 1;">
            Submit Proposal Application
          </button>
          <button type="reset" id="btn-reset-form" class="card-btn" style="width: auto;">
            Reset Form
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function handleFormSubmit(e) {
      e.preventDefault();
      const alertBox = document.getElementById('submission-alert');
      alertBox.style.display = 'block';
      alertBox.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
